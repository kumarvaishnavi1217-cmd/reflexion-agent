[project]
name = "reflexion-replication"
version = "0.1.0"
description = "Replication of Reflexion (Shinn et al., NeurIPS 2023) on HumanEval with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "anthropic==2.3.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflexion"]
