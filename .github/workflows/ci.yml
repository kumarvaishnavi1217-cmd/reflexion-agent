name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check reflexion tests && ruff format --check reflexion tests
      - run: mypy reflexion
      - run: docker pull -q python:3.12-slim
      - name: Tests (graph logic with a scripted LLM, guardrails, Docker sandbox, metrics)
        run: pytest
